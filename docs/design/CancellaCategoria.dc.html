<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Sottomano, cancella categoria</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input{letter-spacing:inherit}
a{color:#3B4FE0;text-decoration:none}a:hover{color:#2A3AB8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; font-family: Onest, system-ui, sans-serif; letter-spacing: 0.02em; color: #1C1E2E">
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none"><dc-import name="Archivio" hint-size="390px,844px"></dc-import></div>
<div style="position: absolute; inset: 0; background: rgba(28,30,70,0.42)"></div>
<div role="alertdialog" aria-labelledby="ct" style="position: absolute; left: 24px; right: 24px; top: 50%; transform: translateY(-50%); background: #FFFFFF; border-radius: 30px; padding: 26px 22px 20px; box-shadow: 0 20px 50px rgba(28,30,70,0.25); display: flex; flex-direction: column; align-items: center; text-align: center">
<span style="width: 60px; height: 60px; border-radius: 30px; background: #FDECEC; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#D92D20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></span>
<h2 id="ct" style="margin: 16px 0 0; font-size: 21px; font-weight: 700">Cancellare la categoria Bollette?</h2>
<p style="margin: 8px 0 0; font-size: 15px; font-weight: 400; color: #4B4E63; line-height: 1.5">Dentro ci sono 12 documenti. Cosa vuoi farne?</p>
<div role="radiogroup" aria-label="Cosa fare dei documenti" style="margin-top: 16px; width: 100%; display: flex; flex-direction: column; gap: 8px">
<button type="button" role="radio" aria-checked="{{mvChecked}}" onClick="{{mvPick}}" style="width: 100%; border: 2px solid {{mvBorder}}; border-radius: 18px; background: {{mvBg}}; font: inherit; color: #1C1E2E; padding: 12px 14px; display: flex; gap: 12px; align-items: center; text-align: left; cursor: pointer"><span aria-hidden="true" style="width: 22px; height: 22px; flex: none; box-sizing: border-box; border-radius: 11px; border: 2px solid {{mvRing}}; display: flex; align-items: center; justify-content: center"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{mvDot}}"></span></span><span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">Spostali in Altro</span><span style="font-size: 13px; font-weight: 400; color: #6A6D80">Restano nell’app, in una cartella generica</span></span></button>
<button type="button" role="radio" aria-checked="{{rmChecked}}" onClick="{{rmPick}}" style="width: 100%; border: 2px solid {{rmBorder}}; border-radius: 18px; background: {{rmBg}}; font: inherit; color: #1C1E2E; padding: 12px 14px; display: flex; gap: 12px; align-items: center; text-align: left; cursor: pointer"><span aria-hidden="true" style="width: 22px; height: 22px; flex: none; box-sizing: border-box; border-radius: 11px; border: 2px solid {{rmRing}}; display: flex; align-items: center; justify-content: center"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{rmDot}}"></span></span><span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">Cancellali</span><span style="font-size: 13px; font-weight: 400; color: #6A6D80">Spariscono insieme alla categoria</span></span></button>
</div>
<button type="button" style="margin-top: 18px; width: 100%; height: 54px; border: 0; border-radius: 27px; background: #D92D20; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; box-shadow: 0 8px 18px rgba(217,45,32,0.25)">{{cta}}</button>
<a href="Archivio.dc.html" style="margin-top: 8px; width: 100%; height: 52px; border-radius: 26px; background: #F1EFFD; color: #1C1E2E; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center">Annulla</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { mode: 'mv' };
}
renderVals() {
const g = (a, b) => 'linear-gradient(135deg, ' + a + ', ' + b + ')';
const v = {};
['mv', 'rm'].forEach((k) => {
const on = this.state.mode === k;
v[k + 'Checked'] = on ? 'true' : 'false';
v[k + 'Border'] = on ? '#6D5CE6' : 'transparent';
v[k + 'Bg'] = on ? '#F7F6FE' : '#F7F7FA';
v[k + 'Ring'] = on ? '#6D5CE6' : '#C9CCDA';
v[k + 'Dot'] = on ? '#6D5CE6' : 'transparent';
v[k + 'Pick'] = () => this.setState({ mode: k });
});
v.cta = this.state.mode === 'mv' ? 'Cancella la categoria' : 'Cancella tutto';
return v;
}
}
</script>
</body>
</html>
