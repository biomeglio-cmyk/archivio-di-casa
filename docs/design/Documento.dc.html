</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { on: true, fav: true };
}
renderVals() {
const on = this.state.on;
const fav = this.state.fav;
return {
onAttr: on ? 'true' : 'false',
trackColor: on ? 'linear-gradient(135deg, #FFA36E, #F5824A)' : '#D6D8E4',
knobSide: on ? 'flex-end' : 'flex-start',
reminderText: on ? '2 giorni prima della scadenza' : 'Nessun promemoria',
toggle: () => this.setState({ on: !this.state.on }),
favPressed: fav ? 'true' : 'false',
favLabel: fav ? 'Togli dai preferiti' : 'Aggiungi ai preferiti',
heartFill: fav ? '#E8457A' : 'none',
toggleFav: () => this.setState({ fav: !this.state.fav })
};
}
}
</script>
