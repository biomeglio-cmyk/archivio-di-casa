<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Sottomano, nuova categoria</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input{letter-spacing:inherit}
a{color:#3B4FE0;text-decoration:none}a:hover{color:#2A3AB8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; font-family: Onest, system-ui, sans-serif; letter-spacing: 0.02em; color: #1C1E2E">
<div style="height: 844px; box-sizing: border-box; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; padding: 24px 22px 36px">
<div style="display: flex; align-items: center; justify-content: space-between"><a href="Main.dc.html" aria-label="Indietro" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #F1EFFD; color: #1C1E2E; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a><span style="font-size: 17px; font-weight: 600">Nuova categoria</span><span style="width: 44px"></span></div>
<div style="margin-top: 20px; display: flex; justify-content: center">
<div aria-label="Anteprima della categoria" role="img" style="width: 172px; height: 140px; box-sizing: border-box; padding: 16px; border-radius: 24px; background: {{bg}}; color: #FFFFFF; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 12px 24px {{shadow}}">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{iconPath}}"></path></svg>
<span style="display: flex; flex-direction: column"><span style="font-size: 17px; font-weight: 600">Animali</span><span style="font-size: 13px; font-weight: 400">0 documenti</span></span>
</div>
</div>
<h2 style="margin: 0; font-size: 13px; font-weight: 400; text-transform: uppercase; letter-spacing: 0.1em; color: #6A6D80; margin-top: 24px">Nome</h2>
<label style="margin-top: 10px; display: flex; align-items: center; height: 56px; padding: 0 18px; background: #FFFFFF; border-radius: 22px; box-shadow: 0 6px 22px rgba(28,30,70,0.08); border-radius: 18px"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Nome della categoria</span><input type="text" value="Animali" placeholder="" style="flex: 1; border: 0; outline: none; background: transparent; font: inherit; font-size: 16px; font-weight: 500; color: #1C1E2E"></label>
<h2 style="margin: 0; font-size: 13px; font-weight: 400; text-transform: uppercase; letter-spacing: 0.1em; color: #6A6D80; margin-top: 24px">Colore</h2>
<div role="radiogroup" aria-label="Colore" style="margin-top: 12px; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); justify-items: center">
<sc-for list="{{colors}}" as="c" hint-placeholder-count="8">
<button type="button" role="radio" aria-label="{{c.name}}" aria-checked="{{c.checked}}" onClick="{{c.pick}}" style="width: 38px; height: 38px; border: 3px solid {{c.ring}}; border-radius: 19px; padding: 0; background: {{c.bg}}; cursor: pointer; box-shadow: 0 0 0 2px {{c.outer}}"></button>
</sc-for>
</div>
<h2 style="margin: 0; font-size: 13px; font-weight: 400; text-transform: uppercase; letter-spacing: 0.1em; color: #6A6D80; margin-top: 24px">Icona</h2>
<div role="radiogroup" aria-label="Icona" style="margin-top: 12px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{icons}}" as="i" hint-placeholder-count="10">
<button type="button" role="radio" aria-label="{{i.name}}" aria-checked="{{i.checked}}" onClick="{{i.pick}}" style="height: 56px; border: 0; border-radius: 16px; background: {{i.bg}}; color: {{i.fg}}; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: {{i.shadow}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.path}}"></path></svg></button>
</sc-for>
</div>
<h2 style="margin: 0; font-size: 13px; font-weight: 400; text-transform: uppercase; letter-spacing: 0.1em; color: #6A6D80; margin-top: 24px">Per chi è</h2>
<span style="margin-top: 10px; position: relative; display: flex; align-items: center"><label for="chi" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Per chi è questa categoria</label><select id="chi" style="width: 100%; height: 56px; padding: 0 44px 0 18px; border: 0; border-radius: 18px; background: #FFFFFF; box-shadow: 0 6px 22px rgba(28,30,70,0.08); font: inherit; font-size: 16px; font-weight: 600; color: #1C1E2E; appearance: none; -webkit-appearance: none; cursor: pointer"><option selected="">Tutta la famiglia</option><option>Giulia</option><option>Marco</option><option>Sofia</option></select><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6A6D80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 16px; pointer-events: none"><path d="m6 9 6 6 6-6"></path></svg></span>
<a href="Main.dc.html" style="margin-top: 26px; height: 56px; border-radius: 28px; background: {{bg}}; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 22px {{shadow}}">Crea categoria</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { color: 'men', icon: 'paw' };
}
renderVals() {
const g = (a, b) => 'linear-gradient(135deg, ' + a + ', ' + b + ')';
const C = [
{ id: 'ind', name: 'Indaco', a: '#4A5CF0', b: '#8B6CF0', r: '100,90,235', t: '#F1EFFD', f: '#4A3FD9' },
{ id: 'lil', name: 'Lilla', a: '#A59AF7', b: '#8778EE', r: '135,120,238', t: '#F1EFFD', f: '#5B4BD6' },
{ id: 'azz', name: 'Azzurro', a: '#86B4F7', b: '#6494EE', r: '100,148,238', t: '#EAF2FE', f: '#2F62C8' },
{ id: 'men', name: 'Menta', a: '#6FD3AE', b: '#45B68E', r: '69,182,142', t: '#E6F7F0', f: '#1F7A5A' },
{ id: 'gia', name: 'Giallo', a: '#F5CB6B', b: '#EBAA45', r: '235,170,69', t: '#FDF5E2', f: '#8A5A0B' },
{ id: 'alb', name: 'Albicocca', a: '#FFA36E', b: '#F5824A', r: '245,130,74', t: '#FFF0E7', f: '#B5541C' },
{ id: 'ros', name: 'Rosa', a: '#F79BBA', b: '#EE7499', r: '238,116,153', t: '#FDEBF1', f: '#B42A5A' },
{ id: 'gri', name: 'Grigio', a: '#A9AFC4', b: '#858CA6', r: '110,118,145', t: '#F0F1F5', f: '#4B5068' }
];
const I = [
{ id: 'paw', name: 'Animali', p: 'M8 11a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM16 11a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM5 15a1.8 1.8 0 1 0 0-3.6A1.8 1.8 0 0 0 5 15zM19 15a1.8 1.8 0 1 0 0-3.6 1.8 1.8 0 0 0 0 3.6zM12 13c-3 0-5 3-5 5a2 2 0 0 0 2 2c1 0 2-.5 3-.5s2 .5 3 .5a2 2 0 0 0 2-2c0-2-2-5-5-5z' },
{ id: 'doc', name: 'Documento', p: 'M6 3h8l5 5v13H6zM14 3v5h5M9 13h6M9 17h4' },
{ id: 'home', name: 'Casa', p: 'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z' },
{ id: 'car', name: 'Auto', p: 'M3 13l2-6a2 2 0 0 1 2-1h10a2 2 0 0 1 2 1l2 6v4H3zM7.5 17h.01M16.5 17h.01' },
{ id: 'heart', name: 'Salute', p: 'M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z' },
{ id: 'school', name: 'Scuola', p: 'M3 9l9-5 9 5-9 5zM7 11.2V16c0 1.5 2.2 3 5 3s5-1.5 5-3v-4.8M21 9v6' },
{ id: 'work', name: 'Lavoro', p: 'M3 9.5A2.5 2.5 0 0 1 5.5 7h13A2.5 2.5 0 0 1 21 9.5v8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5zM9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M3 12h18' },
{ id: 'key', name: 'Chiavi', p: 'M14 8a4 4 0 1 1-1.2 2.8L4 20v-3h2v-2h2l1.8-1.8M15.5 6.5h.01' },
{ id: 'plane', name: 'Viaggi', p: 'M10 14 3 11l2-2 7 1 4-4c1-1 3-1.5 3.5-1S19 7 18 8l-4 4 1 7-2 2-3-7-3 3v2l-2 1-1-3-3-1 1-2h2z' },
{ id: 'money', name: 'Spese', p: 'M3 7.5A2.5 2.5 0 0 1 5.5 5h13A2.5 2.5 0 0 1 21 7.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 16.5zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM6.5 12h.01M17.5 12h.01' }
];
const col = C.find((c) => c.id === this.state.color);
const ic = I.find((i) => i.id === this.state.icon);
return {
bg: g(col.a, col.b), shadow: 'rgba(' + col.r + ',0.28)', iconPath: ic.p,
colors: C.map((c) => { const on = c.id === col.id; return { name: c.name, bg: g(c.a, c.b), checked: on ? 'true' : 'false', ring: '#FFFFFF', outer: on ? c.b : 'transparent', pick: () => this.setState({ color: c.id }) }; }),
icons: I.map((i) => { const on = i.id === ic.id; return { name: i.name, path: i.p, checked: on ? 'true' : 'false', bg: on ? g(col.a, col.b) : col.t, fg: on ? '#FFFFFF' : col.f, shadow: on ? '0 6px 12px rgba(' + col.r + ',0.25)' : 'none', pick: () => this.setState({ icon: i.id }) }; })
};
}
}
</script>
</body>
</html>
