<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Sottomano, ricerca</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input{letter-spacing:inherit}
a{color:#3B4FE0;text-decoration:none}a:hover{color:#2A3AB8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; font-family: Onest, system-ui, sans-serif; letter-spacing: 0.02em; color: #1C1E2E">
<div style="height: 844px; box-sizing: border-box; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; padding: 24px 22px 40px">
<div style="display: flex; align-items: center; gap: 10px">
<label style="flex: 1; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; background: #F1EFFD; border-radius: 26px; color: #6D5CE6; box-shadow: 0 0 0 2px #C9C2FF">
<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Cerca tra i documenti</span>
<input type="search" value="{{q}}" onInput="{{onQuery}}" placeholder="Cerca un documento" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 16px; font-weight: 500; color: #1C1E2E">
</label>
<a href="Main.dc.html" style="font-size: 15px; font-weight: 600">Annulla</a>
</div>
<div role="group" aria-label="Filtra" style="margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
<button type="button" aria-pressed="{{f.pressed}}" onClick="{{f.pick}}" style="height: 36px; padding: 0 14px; border: 0; border-radius: 18px; background: {{f.bg}}; color: {{f.fg}}; font: inherit; font-size: 14px; font-weight: {{f.weight}}; cursor: pointer; box-shadow: {{f.shadow}}">{{f.label}}</button>
</sc-for>
</div>
<p aria-live="polite" style="margin: 18px 0 0; font-size: 13px; font-weight: 400; text-transform: uppercase; letter-spacing: 0.1em; color: #6A6D80">{{countText}}</p>
<div style="margin-top: 12px; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{results}}" as="r" hint-placeholder-count="4">
<a href="{{r.href}}" style="display: flex; align-items: center; gap: 14px; padding: 12px 14px; background: #FFFFFF; border-radius: 22px; box-shadow: 0 6px 22px rgba(28,30,70,0.08); border-radius: 20px; color: #1C1E2E">
<span style="width: 46px; height: 46px; flex: none; border-radius: 14px; background: {{r.bg}}; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 12px {{r.shadow}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"></path></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 500">{{r.pre}}<mark style="background: #E8E5FD; color: #3A2BC8; font-weight: 700; border-radius: 4px; padding: 0 1px">{{r.hit}}</mark>{{r.post}}</span>
<span style="font-size: 13px; font-weight: 400; color: #6A6D80">{{r.sub}}</span>
</span>
</a>
</sc-for>
<sc-if value="{{none}}" hint-placeholder-val="{{false}}">
<div style="padding: 28px 20px; border-radius: 22px; background: #F7F6FE; text-align: center"><p style="margin: 0; font-size: 16px; font-weight: 600">Nessun risultato</p><p style="margin: 6px 0 0; font-size: 14px; font-weight: 400; color: #6A6D80">Prova con un'altra parola, per esempio il nome di un negozio.</p></div>
</sc-if>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { q: 'bol', f: 'all' };
}
renderVals() {
const g = (a, b) => 'linear-gradient(135deg, ' + a + ', ' + b + ')';
const AL = [g('#FFA36E', '#F5824A'), 'rgba(245,130,74,0.22)'], MN = [g('#6FD3AE', '#45B68E'), 'rgba(69,182,142,0.22)'], LI = [g('#A59AF7', '#8778EE'), 'rgba(135,120,238,0.22)'], AZ = [g('#86B4F7', '#6494EE'), 'rgba(100,148,238,0.22)'], RO = [g('#F79BBA', '#EE7499'), 'rgba(238,116,153,0.22)'], GI = [g('#F5CB6B', '#EBAA45'), 'rgba(235,170,69,0.22)'];
const DOC = 'M6 3h8l5 5v13H6zM14 3v5h5M9 13h6M9 17h4', CARDI = 'M2 7.5A2.5 2.5 0 0 1 4.5 5h15A2.5 2.5 0 0 1 22 7.5v9a2.5 2.5 0 0 1-2.5 2.5h-15A2.5 2.5 0 0 1 2 16.5zM2 10h20M6 15h4', CAL = 'M3 7.5A2.5 2.5 0 0 1 5.5 5h13A2.5 2.5 0 0 1 21 7.5v11a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 18.5zM3 10h18M8 3v4M16 3v4', FOLD = 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z';
const data = [
{ t: 'Bolletta luce novembre', sub: 'Bollette · scade il 14 novembre', k: 'doc', c: AL, i: DOC, href: 'Documento.dc.html' },
{ t: 'Bolletta gas ottobre', sub: 'Bollette · pagata', k: 'doc', c: AL, i: DOC, href: 'Documento.dc.html' },
{ t: 'Bolletta acqua ottobre', sub: 'Bollette · pagata', k: 'doc', c: AL, i: DOC, href: 'Documento.dc.html' },
{ t: 'Bollette', sub: 'Cartella · 12 documenti', k: 'doc', c: AL, i: FOLD, href: 'Archivio.dc.html' },
{ t: 'Pagare bolletta luce', sub: 'Scadenza · tra 3 giorni', k: 'sca', c: LI, i: CAL, href: 'Scadenze.dc.html' },
{ t: "Carta d'identità", sub: 'Documenti · rinnovo entro il 12 dic', k: 'doc', c: AZ, i: DOC, href: 'Documento.dc.html' },
{ t: 'Tessera sanitaria', sub: 'Salute · valida fino al 2029', k: 'doc', c: RO, i: DOC, href: 'Documento.dc.html' },
{ t: 'Garanzia lavatrice', sub: 'Garanzie · scade a marzo 2027', k: 'doc', c: GI, i: DOC, href: 'Documento.dc.html' },
{ t: 'Biblioteca comunale', sub: 'Tessera', k: 'tes', c: LI, i: CARDI, href: 'Tessere.dc.html' },
{ t: 'Supermercato', sub: 'Tessera fedeltà', k: 'tes', c: MN, i: CARDI, href: 'Tessere.dc.html' },
{ t: 'Palestra', sub: 'Tessera · scade a marzo', k: 'tes', c: RO, i: CARDI, href: 'Tessere.dc.html' }
];
const q = this.state.q.trim().toLowerCase();
const res = data.filter((d) => (this.state.f === 'all' || d.k === this.state.f) && (q === '' || d.t.toLowerCase().indexOf(q) >= 0)).map((d) => {
const i = q ? d.t.toLowerCase().indexOf(q) : -1;
return { pre: i >= 0 ? d.t.slice(0, i) : d.t, hit: i >= 0 ? d.t.slice(i, i + q.length) : '', post: i >= 0 ? d.t.slice(i + q.length) : '', sub: d.sub, bg: d.c[0], shadow: d.c[1], icon: d.i, href: d.href };
});
const F = [['all', 'Tutto'], ['doc', 'Documenti'], ['tes', 'Tessere'], ['sca', 'Scadenze']];
return {
q: this.state.q,
onQuery: (e) => this.setState({ q: e.target.value }),
filters: F.map(([id, label]) => { const on = this.state.f === id; return { label: label, pressed: on ? 'true' : 'false', bg: on ? g('#4A5CF0', '#8B6CF0') : '#F1EFFD', fg: on ? '#FFFFFF' : '#1C1E2E', weight: on ? 600 : 500, shadow: on ? '0 6px 14px rgba(100,90,235,0.25)' : 'none', pick: () => this.setState({ f: id }) }; }),
results: res, none: res.length === 0,
countText: res.length === 1 ? '1 risultato' : res.length + ' risultati'
};
}
}
</script>
</body>
</html>
