<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { order: ["sup", "bib", "pal", "ass", "cin"], sel: 'bib' };
}
renderVals() {
const g = (a, b) => 'linear-gradient(135deg, ' + a + ', ' + b + ')';
const D = {"sup": {"name": "SuperCasa", "sub": "Carta fedelt\u00e0", "a": "#1FA37A", "b": "#0B6E50", "r": "11,110,80", "ini": ""}, "bib": {"name": "Biblioteca", "sub": "Tessera lettore", "a": "#3B4FE0", "b": "#2A1F9E", "r": "42,31,158", "ini": ""}, "pal": {"name": "FitLab", "sub": "Abbonamento", "a": "#2A2C40", "b": "#111222", "r": "17,18,34", "ini": ""}, "ass": {"name": "Circolo Aurora", "sub": "Socia", "a": "#E8566B", "b": "#B32A55", "r": "179,42,85", "ini": ""}, "cin": {"name": "Cinema Lux", "sub": "Card ingressi", "a": "#E07A1F", "b": "#A6460C", "r": "166,70,12", "ini": ""}};
const order = this.state.order, sel = this.state.sel;
const tap = (id) => {
if (sel === null) { this.setState({ sel: id }); return; }
if (sel === id) { this.setState({ sel: null }); return; }
const o = order.slice(); const a = o.indexOf(sel), b = o.indexOf(id); o[a] = id; o[b] = sel;
this.setState({ order: o, sel: null });
};
const items = order.map((id, i) => {
const d = D[id]; const on = id === sel;
return Object.assign({}, d, { bg: g(d.a, d.b), shadow: on ? '0 20px 34px rgba(' + d.r + ',0.45)' : '0 4px 14px rgba(28,30,70,0.07)',
tf: on ? 'scale(1.04) translateY(-4px)' : 'none', z: on ? 2 : 1, pressed: on ? 'true' : 'false',
label: d.name + (on ? ', selezionata: tocca dove spostarla' : ', tocca per spostarla'), tap: () => tap(id) });
});
return { items: items, hint: sel === null ? 'Tocca una tessera e poi il punto dove spostarla. Sul telefono: tieni premuto e trascina.' : 'Ora tocca il punto dove vuoi spostarla.', doneHref: 'Tessere.dc.html' };
}
}
</script>
