<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { z: 1 };
}
renderVals() {
const z = this.state.z;
return { zoom: z, pct: Math.round(z * 100) + '%', gap: Math.round(466 * (z - 1)) + 'px',
zoomIn: () => this.setState({ z: Math.min(2, this.state.z + 0.25) }),
zoomOut: () => this.setState({ z: Math.max(1, this.state.z - 0.25) }) };
}
}
